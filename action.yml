name: Readme Stats Action
description: Generate GitHub Readme Stats cards in GitHub Actions using the Go service.
author: soulteary
inputs:
  card:
    description: Card type to generate (stats, top-langs, pin, wakatime, gist).
    required: true
  options:
    description: Options for the card (query string or JSON).
    required: false
    default: ""
  path:
    description: >-
      Output path for the SVG file. Must be relative to the workspace and stay
      inside it: absolute paths, paths climbing out with "..", and paths
      containing a line break are rejected. Include the filename, ending .svg.
    required: false
    default: ""
  token:
    description: GitHub token (PAT or GITHUB_TOKEN).
    required: false
    default: ""
  version:
    description: Version of the github-readme-stats binary to use (e.g., v1.0.0). Defaults to the pinned release below, so an upstream release cannot change this action's behaviour; set it to "latest" to always resolve the newest upstream release.
    required: false
    default: "v1.0.0"
  repo:
    description: GitHub repository in format owner/repo. Defaults to soulteary/github-readme-stats.
    required: false
    default: "soulteary/github-readme-stats"
outputs:
  path:
    description: Path where the SVG file was written.
    value: ${{ steps.generate.outputs.path }}
runs:
  using: composite
  steps:
    - name: Generate card
      id: generate
      run: bash "${{ github.action_path }}/index.sh"
      shell: bash
      env:
        INPUT_CARD: ${{ inputs.card }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TOKEN: ${{ inputs.token || github.token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPO: ${{ inputs.repo }}
        PAT_1: ${{ inputs.token || github.token }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}

branding:
  icon: bar-chart-2
  color: blue
